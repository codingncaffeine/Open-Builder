# ALSA configuration for test runs (ALSA_CONFIG_PATH): the only device is "default", a null PCM that accepts and
# discards every sample. It needs no hardware and no audio server, so a program that refuses to start without a
# sound device still starts, and nothing it plays can be heard. tools/nested.sh hides the real devices anyway.
pcm.!default {
    type null
}
ctl.!default {
    type null
}
