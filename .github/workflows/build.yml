name: build

on:
  push:
  pull_request:

jobs:
  # The hook DLL builds only with the 2003 compiler toolkit, which CI cannot download, so it is built and matched
  # locally (tools/build.sh, tools/match.sh). CI checks that no original content slipped into the tree and builds
  # the host tools.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: No original content
        run: tools/check-content.sh
      - name: Install the tools' dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build libzydis-dev
      - name: Build obcmp and obsig
        run: cmake -S tools/obcmp -B build/obcmp -G Ninja && cmake --build build/obcmp
